# ============================================
# Bezubaan Helping Hands — Local Development Infrastructure
# ============================================
# Usage: docker compose up -d
# This starts only the infrastructure services.
# Run the NestJS backend separately with: cd backend && npm run start:dev
# ============================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bezubaan-postgres
    restart: unless-stopped
    ports:
      - '15432:5432'
    environment:
      POSTGRES_USER: bezubaan
      POSTGRES_PASSWORD: bezubaan_dev
      POSTGRES_DB: bezubaan_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bezubaan -d bezubaan_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bezubaan-redis
    restart: unless-stopped
    ports:
      - '16379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bezubaan-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 30s
      timeout: 10s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: bezubaan-ai-service
    restart: unless-stopped
    ports:
      - '18000:8000'
    environment:
      AI_PROVIDER: mock
      AI_SERVICE_PORT: 8000
      LOG_LEVEL: INFO
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
